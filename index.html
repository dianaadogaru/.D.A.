<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Buon Compleanno 💜</title>

  <!-- Google Font Backup -->
  <link href="https://fonts.googleapis.com/css2?family=Satisfy&display=swap" rel="stylesheet">

  <style>
    @font-face {
      font-family: 'Harlow Solid Italic';
      src: url('HARLOWSI.TTF') format('truetype');
      font-weight: normal;
      font-style: normal;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Harlow Solid Italic', 'Satisfy', cursive, sans-serif;
      font-weight: normal;
      background: linear-gradient(rgba(0, 0, 0, 0.2), rgba(0, 0, 0, 0.35)), url('1.jpg');
      background-size: cover;
      background-position: center bottom;
      background-repeat: no-repeat;
      background-attachment: fixed;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      overflow-x: hidden;
    }

    /* --- Act 1: Full-Screen Stardust Scratch-Off Canvas --- */
    #scratchCanvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 300;
      touch-action: none;
      cursor: grab;
      transition: opacity 0.9s ease;
    }

    #scratchCanvas.cleared {
      opacity: 0;
      pointer-events: none;
    }

    /* --- Main Frosted Glass Card --- */
    .card {
      background: rgba(11, 20, 30, 0.78);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      max-width: 440px;
      width: 100%;
      border-radius: 26px;
      padding: 28px 24px;
      text-align: center;
      border: 2.5px solid rgba(52, 211, 153, 0.5);
      box-shadow:
        0 0 15px rgba(52, 211, 153, 0.45),
        0 0 40px rgba(52, 211, 153, 0.35),
        0 0 80px rgba(52, 211, 153, 0.20),
        0 20px 45px rgba(0, 0, 0, 0.7);
    }

    .title {
      font-family: 'Harlow Solid Italic', 'Satisfy', cursive, sans-serif;
      font-size: clamp(3.3rem, 9.5vw, 4.1rem);
      font-weight: normal;
      line-height: 1.15;
      margin-bottom: 18px;
      color: #ffffff;
      text-shadow:
        0 0 10px rgba(52, 211, 153, 0.7),
        0 0 20px rgba(52, 211, 153, 0.3);
    }

    /* Interactive Secret Heart in the Title */
    .secret-heart {
      display: inline-block;
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      animation: subtleHeartPulse 2.4s infinite ease-in-out;
      transition: transform 0.25s ease;
    }

    .secret-heart:hover,
    .secret-heart:active {
      transform: scale(1.22);
    }

    @keyframes subtleHeartPulse {
      0%, 100% {
        transform: scale(1);
        filter: drop-shadow(0 0 6px rgba(192, 132, 252, 0.5));
      }
      50% {
        transform: scale(1.1);
        filter: drop-shadow(0 0 14px rgba(192, 132, 252, 0.95));
      }
    }

    /* --- Video, Candles & Custom Play Button Box --- */
    .media-wrapper {
      position: relative;
      width: 100%;
      min-height: 310px;
      border-radius: 18px;
      overflow: hidden;
      background-color: #0d1621;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .media-wrapper.revealed {
      min-height: 0;
    }

    .reveal-video {
      width: 100%;
      height: auto;
      display: block;
      -webkit-filter: blur(32px) scale(1.06);
      filter: blur(32px) scale(1.06);
      transition: -webkit-filter 0.9s ease, filter 0.9s ease, transform 0.9s ease;
    }

    .media-wrapper.revealed .reveal-video {
      -webkit-filter: blur(0) scale(1);
      filter: blur(0) scale(1);
    }

    /* --- Act 2: Oversized 3-Candle Overlay --- */
    .candle-overlay {
      position: absolute;
      inset: 0;
      background: rgba(8, 15, 24, 0.62);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px 14px;
      z-index: 4;
      transition: opacity 0.7s ease;
    }

    .media-wrapper.revealed .candle-overlay {
      opacity: 0;
      pointer-events: none;
    }

    .candle-prompt {
      font-size: clamp(2.1rem, 6.8vw, 2.65rem);
      font-weight: normal;
      line-height: 1.25;
      color: #ffffff;
      margin-bottom: 22px;
      text-shadow: 0 0 14px rgba(251, 191, 36, 0.7);
    }

    .candles-row {
      display: flex;
      justify-content: center;
      align-items: flex-end;
      gap: 40px;
      padding-top: 46px;
    }

    .candle {
      position: relative;
      width: 38px;
      height: 116px;
      background: linear-gradient(180deg, #fef3c7 0%, #34d399 100%);
      border-radius: 10px 10px 6px 6px;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.5), inset 0 3px 6px rgba(255, 255, 255, 0.65);
      cursor: pointer;
      border: none;
      transition: transform 0.2s ease;
    }

    .candle:active {
      transform: scale(0.92);
    }

    /* Wick */
    .candle::before {
      content: '';
      position: absolute;
      top: -13px;
      left: 50%;
      transform: translateX(-50%);
      width: 4px;
      height: 13px;
      background: #1e293b;
      border-radius: 2px;
    }

    /* Glowing Flame */
    .flame {
      position: absolute;
      top: -54px;
      left: 50%;
      transform: translateX(-50%);
      width: 28px;
      height: 42px;
      background: radial-gradient(ellipse at bottom, #ffffff 10%, #fde047 45%, #f59e0b 85%, transparent 100%);
      border-radius: 50% 50% 50% 50% / 65% 65% 35% 35%;
      box-shadow:
        0 0 16px #fbbf24,
        0 0 34px rgba(251, 191, 36, 0.9),
        0 0 54px rgba(52, 211, 153, 0.6);
      animation: flicker 0.9s infinite alternate ease-in-out;
      transition: opacity 0.25s ease, transform 0.25s ease;
    }

    .candle:nth-child(2) .flame {
      animation-delay: 0.25s;
    }

    .candle:nth-child(3) .flame {
      animation-delay: 0.5s;
    }

    @keyframes flicker {
      0% { transform: translateX(-50%) scale(1) rotate(-2deg); }
      50% { transform: translateX(-50%) scale(1.07, 0.94) rotate(2deg); }
      100% { transform: translateX(-50%) scale(0.95, 1.06) rotate(-1deg); }
    }

    .candle.blown .flame {
      opacity: 0;
      transform: translateX(-50%) scale(0.1);
      animation: none;
    }

    /* Rising Smoke Puff */
    .smoke {
      position: absolute;
      top: -46px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 2.1rem;
      opacity: 0;
      pointer-events: none;
    }

    .candle.blown .smoke {
      animation: smokeRise 1.1s ease-out forwards;
    }

    @keyframes smokeRise {
      0% { opacity: 0.95; transform: translate(-50%, 0) scale(0.6); }
      100% { opacity: 0; transform: translate(-50%, -48px) scale(1.5); }
    }

    /* --- Custom Video Play Button Overlay (Appears after candles) --- */
    .video-play-overlay {
      position: absolute;
      inset: 0;
      background: rgba(8, 15, 24, 0.28);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 10px;
      z-index: 3;
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s ease;
    }

    .media-wrapper.revealed .video-play-overlay:not(.hidden) {
      opacity: 1;
      pointer-events: auto;
    }

    .play-circle {
      width: 78px;
      height: 78px;
      border-radius: 50%;
      background: rgba(11, 20, 30, 0.85);
      border: 2.5px solid rgba(52, 211, 153, 0.85);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow:
        0 0 20px rgba(52, 211, 153, 0.65),
        0 0 40px rgba(251, 191, 36, 0.35);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .video-play-overlay:hover .play-circle,
    .video-play-overlay:active .play-circle {
      transform: scale(1.1);
      box-shadow:
        0 0 28px rgba(52, 211, 153, 0.9),
        0 0 50px rgba(251, 191, 36, 0.5);
    }

    .play-triangle {
      width: 0;
      height: 0;
      margin-left: 6px;
      border-top: 16px solid transparent;
      border-bottom: 16px solid transparent;
      border-left: 26px solid #fde68a;
      filter: drop-shadow(0 0 8px rgba(251, 191, 36, 0.7));
    }

    .play-label {
      font-size: 1.75rem;
      color: #ffffff;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.9), 0 0 12px rgba(52, 211, 153, 0.7);
    }

    /* --- Confetti Particles --- */
    .confetti-piece {
      position: fixed;
      top: -15px;
      width: 10px;
      height: 16px;
      border-radius: 2px;
      z-index: 250;
      pointer-events: none;
      animation: confettiFall linear forwards;
    }

    @keyframes confettiFall {
      0% {
        opacity: 1;
        transform: translateY(0) rotate(0deg);
      }
      100% {
        opacity: 0;
        transform: translateY(105vh) rotate(720deg);
      }
    }

    /* --- Oversized Typewriter Message (Appears after video ends) --- */
    .message {
      font-size: clamp(1.95rem, 6vw, 2.3rem);
      font-weight: normal;
      line-height: 1.45;
      color: #e2e8f0;
    }

    .message.active {
      margin-top: 20px;
    }

    /* --- Delayed Secret Note Button --- */
    .secret-btn-wrapper {
      position: fixed;
      bottom: 20px;
      right: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 99;
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transform: translateY(15px);
      transition: opacity 0.8s ease, transform 0.8s ease;
    }

    .secret-btn-wrapper.show {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    .secret-btn {
      background: rgba(11, 20, 30, 0.85);
      border: 1.5px solid rgba(52, 211, 153, 0.6);
      color: #ffffff;
      font-size: 1.6rem;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 0 15px rgba(52, 211, 153, 0.4);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .secret-btn-wrapper:hover .secret-btn,
    .secret-btn-wrapper:active .secret-btn {
      transform: scale(1.08);
      box-shadow: 0 0 25px rgba(52, 211, 153, 0.7);
    }

    .click-me-label {
      font-family: sans-serif;
      font-size: 0.85rem;
      color: #34d399;
      margin-top: 5px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      font-weight: 700;
      text-shadow: 0 0 8px rgba(52, 211, 153, 0.5);
    }

    /* --- Shared Modal Styling (Joke & Secret Heart Photo) --- */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.68);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      justify-content: center;
      align-items: center;
      z-index: 200;
      padding: 20px;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .modal-overlay.active {
      display: flex;
      opacity: 1;
    }

    .modal-content {
      background: rgba(11, 20, 30, 0.92);
      border: 2px solid rgba(52, 211, 153, 0.6);
      border-radius: 22px;
      padding: 28px;
      max-width: 360px;
      width: 100%;
      text-align: center;
      position: relative;
      box-shadow: 0 0 30px rgba(52, 211, 153, 0.4);
      transform: scale(0.8);
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .modal-overlay.active .modal-content {
      transform: scale(1);
    }

    .modal-close {
      position: absolute;
      top: 10px;
      right: 14px;
      font-size: 1.7rem;
      color: #94a3b8;
      cursor: pointer;
      line-height: 1;
    }

    .modal-title {
      font-size: 2.3rem;
      font-weight: normal;
      color: #ffffff;
      margin-bottom: 14px;
    }

    .joke-text {
      font-family: sans-serif;
      font-size: 1.2rem;
      color: #e2e8f0;
      line-height: 1.5;
      margin-bottom: 16px;
    }

    .joke-punchline {
      font-family: sans-serif;
      font-weight: bold;
      color: #34d399;
      font-size: 1.25rem;
    }

    /* Secret Heart Photo Styling */
    .photo-modal-content {
      max-width: 380px;
      padding: 24px 20px 20px;
    }

    .secret-photo {
      width: 100%;
      max-height: 60vh;
      object-fit: cover;
      border-radius: 14px;
      border: 1.5px solid rgba(52, 211, 153, 0.5);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.65);
      display: block;
    }

    .photo-caption {
      font-size: 1.65rem;
      color: #e2e8f0;
      margin-top: 14px;
      line-height: 1.3;
    }
  </style>
</head>
<body>

  <!-- Act 1: Shimmering Emerald & Gold Stardust Scratch Layer -->
  <canvas id="scratchCanvas"></canvas>

  <!-- Background Song -->
  <audio id="cardAudio" src="Lose Myself (Rock Ballad Version).mp3" preload="auto"></audio>

  <div class="card">
    <h1 class="title">
      Buon Compleanno <span class="secret-heart" onclick="toggleHeartPhotoModal()" title="Tocca il cuore">💜</span>
    </h1>

    <div class="media-wrapper" id="revealBox">
      <video id="birthdayVideo" class="reveal-video" src="video.mp4" playsinline preload="metadata"></video>

      <!-- Custom Play Button Overlay (Shown after candles are blown out) -->
      <div class="video-play-overlay" id="videoPlayOverlay" onclick="playBirthdayVideo()">
        <div class="play-circle">
          <div class="play-triangle"></div>
        </div>
        <span class="play-label">Guarda il video ✨</span>
      </div>

      <!-- Act 2: 3 Oversized Glowing Candles Overlay -->
      <div class="candle-overlay" id="candleOverlay">
        <p class="candle-prompt">Esprimi un desiderio e spegni le candeline ✨</p>
        <div class="candles-row">
          <button type="button" class="candle" aria-label="Candela 1" onclick="blowCandle(this)">
            <span class="flame"></span>
            <span class="smoke">💨</span>
          </button>
          <button type="button" class="candle" aria-label="Candela 2" onclick="blowCandle(this)">
            <span class="flame"></span>
            <span class="smoke">💨</span>
          </button>
          <button type="button" class="candle" aria-label="Candela 3" onclick="blowCandle(this)">
            <span class="flame"></span>
            <span class="smoke">💨</span>
          </button>
        </div>
      </div>
    </div>

    <p class="message" id="birthdayMessage"></p>
  </div>

  <!-- Act 3: Delayed Secret Joke Button (Fades in after typewriter finishes) -->
  <div class="secret-btn-wrapper" id="secretBtnWrapper" onclick="toggleSecretModal()">
    <div class="secret-btn">💌</div>
    <span class="click-me-label">Click me</span>
  </div>

  <!-- Secret Joke Modal -->
  <div id="secretModal" class="modal-overlay" onclick="toggleSecretModal()">
    <div class="modal-content" onclick="event.stopPropagation()">
      <span class="modal-close" onclick="toggleSecretModal()">&times;</span>
      <h2 class="modal-title">Nota Segreta 😜</h2>
      <p class="joke-text">Are we using end-to-end encryption??</p>
      <p class="joke-punchline">Because nobody else can read what's between us.🤪</p>
    </div>
  </div>

  <!-- Secret Heart Photo Modal -->
  <div id="heartPhotoModal" class="modal-overlay" onclick="toggleHeartPhotoModal()">
    <div class="modal-content photo-modal-content" onclick="event.stopPropagation()">
      <span class="modal-close" onclick="toggleHeartPhotoModal()">&times;</span>
      <h2 class="modal-title">Solo per te 💜</h2>
      <!-- Upload your secret photo to GitHub as secret.jpg (or update the filename below) -->
      <img src="secret.jpg" alt="Ricordo Segreto" class="secret-photo" />
      <p class="photo-caption">Un piccolo segreto nascosto nel cuore ✨</p>
    </div>
  </div>

  <script>
    /* ==========================================
       1. STARDUST SCRATCH-OFF LAYER & SONG START
       ========================================== */
    const canvas = document.getElementById('scratchCanvas');
    const ctx = canvas.getContext('2d');
    const audio = document.getElementById('cardAudio');
    let isDrawing = false;
    let scratchCleared = false;
    let audioStarted = false;
    let strokeCounter = 0;

    function initScratchLayer() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const grad = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
      grad.addColorStop(0, '#060c14');
      grad.addColorStop(0.5, '#0b1926');
      grad.addColorStop(1, '#07111a');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const starColors = [
        'rgba(52, 211, 153, 0.85)',
        'rgba(16, 185, 129, 0.65)',
        'rgba(251, 191, 36, 0.85)',
        'rgba(253, 230, 138, 0.75)',
        'rgba(255, 255, 255, 0.6)'
      ];

      const dustCount = Math.floor((canvas.width * canvas.height) / 140);
      for (let i = 0; i < dustCount; i++) {
        const x = Math.random() * canvas.width;
        const y = Math.random() * canvas.height;
        const radius = Math.random() * 1.8 + 0.4;
        ctx.beginPath();
        ctx.arc(x, y, radius, 0, Math.PI * 2);
        ctx.fillStyle = starColors[Math.floor(Math.random() * starColors.length)];
        ctx.fill();
      }

      ctx.save();
      ctx.textAlign = 'center';
      ctx.fillStyle = '#fde68a';
      ctx.shadowColor = 'rgba(52, 211, 153, 0.85)';
      ctx.shadowBlur = 18;
      const fontSize = Math.min(56, Math.max(40, Math.floor(canvas.width * 0.115)));
      ctx.font = `${fontSize}px "Harlow Solid Italic", "Satisfy", cursive`;
      ctx.fillText('Gratta la polvere', canvas.width / 2, canvas.height / 2 - fontSize * 0.55);
      ctx.fillText('di stelle ✨', canvas.width / 2, canvas.height / 2 + fontSize * 0.65);
      ctx.restore();
    }

    async function startBackgroundAudio() {
      if (audioStarted) return;
      audioStarted = true;
      try {
        if (audio.readyState < 1) {
          await new Promise((resolve, reject) => {
            audio.addEventListener('loadedmetadata', resolve, { once: true });
            audio.addEventListener('error', reject, { once: true });
            audio.load();
          });
        }
        audio.currentTime = 0;
        audio.volume = 1.0;
        await audio.play();
      } catch (err) {
        audioStarted = false;
        console.log('Audio waiting for interaction:', err);
      }
    }

    function getPointerPos(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return { x: clientX - rect.left, y: clientY - rect.top };
    }

    function scratchAt(x, y) {
      if (scratchCleared) return;
      ctx.globalCompositeOperation = 'destination-out';
      ctx.beginPath();
      ctx.arc(x, y, 48, 0, Math.PI * 2);
      ctx.fill();

      strokeCounter++;
      if (strokeCounter % 12 === 0) {
        checkScratchProgress();
      }
    }

    function checkScratchProgress() {
      if (scratchCleared) return;
      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
      let transparentPixels = 0;
      const step = 16 * 4;
      for (let i = 3; i < imageData.length; i += step) {
        if (imageData[i] === 0) transparentPixels++;
      }
      const totalSampled = imageData.length / step;
      if ((transparentPixels / totalSampled) > 0.35) {
        scratchCleared = true;
        canvas.classList.add('cleared');
      }
    }

    canvas.addEventListener('mousedown', e => {
      isDrawing = true;
      startBackgroundAudio();
      const pos = getPointerPos(e);
      scratchAt(pos.x, pos.y);
    });

    canvas.addEventListener('mousemove', e => {
      if (!isDrawing) return;
      const pos = getPointerPos(e);
      scratchAt(pos.x, pos.y);
    });

    window.addEventListener('mouseup', () => {
      if (isDrawing) {
        isDrawing = false;
        checkScratchProgress();
      }
    });

    canvas.addEventListener('touchstart', e => {
      isDrawing = true;
      startBackgroundAudio();
      const pos = getPointerPos(e);
      scratchAt(pos.x, pos.y);
    }, { passive: true });

    canvas.addEventListener('touchmove', e => {
      if (!isDrawing) return;
      const pos = getPointerPos(e);
      scratchAt(pos.x, pos.y);
    }, { passive: true });

    canvas.addEventListener('touchend', () => {
      isDrawing = false;
      checkScratchProgress();
    });

    initScratchLayer();

    /* ==========================================
       2. THREE GLOWING CANDLES & CONFETTI REVEAL
       ========================================== */
    let blownCount = 0;
    const totalCandles = 3;

    function blowCandle(candleEl) {
      startBackgroundAudio();
      if (candleEl.classList.contains('blown')) return;
      candleEl.classList.add('blown');
      blownCount++;

      if (blownCount === totalCandles) {
        setTimeout(() => {
          triggerBirthdayReveal();
        }, 350);
      }
    }

    function triggerBirthdayReveal() {
      const box = document.getElementById('revealBox');
      box.classList.add('revealed');
      launchConfetti();
    }

    function launchConfetti() {
      const colors = ['#34d399', '#fbbf24', '#c084fc', '#fde68a', '#ffffff'];
      for (let i = 0; i < 80; i++) {
        const piece = document.createElement('span');
        piece.classList.add('confetti-piece');
        piece.style.left = Math.random() * 100 + 'vw';
        piece.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
        piece.style.animationDuration = (Math.random() * 2 + 2.2) + 's';
        piece.style.animationDelay = (Math.random() * 0.4) + 's';
        document.body.appendChild(piece);

        setTimeout(() => piece.remove(), 4600);
      }
    }

    /* ==========================================
       3. CUSTOM VIDEO PLAY, SONG HANDOFF & TYPEWRITER TRIGGER
       ========================================== */
    const videoEl = document.getElementById('birthdayVideo');
    const videoPlayOverlay = document.getElementById('videoPlayOverlay');

    function playBirthdayVideo() {
      videoPlayOverlay.classList.add('hidden');
      videoEl.controls = true;
      videoEl.play();
    }

    videoEl.addEventListener('play', () => {
      videoPlayOverlay.classList.add('hidden');
      if (!audio.paused) {
        audio.pause();
      }
    });

    videoEl.addEventListener('ended', () => {
      videoPlayOverlay.classList.remove('hidden');
      if (audioStarted && audio.paused) {
        audio.play().catch(() => {});
      }
      typeWriterMessage();
    });

    /* ==========================================
       4. TYPEWRITER MESSAGE & SECRET MODALS
       ========================================== */
    const fullMessage = "Buon compleanno amore mio! Spero che questo giorno ti porti tutta la felicità che meriti! 💜";
    let hasTyped = false;

    function typeWriterMessage() {
      if (hasTyped) return;
      hasTyped = true;

      const msgEl = document.getElementById('birthdayMessage');
      msgEl.classList.add('active');
      msgEl.innerHTML = '';
      let i = 0;

      const timer = setInterval(() => {
        if (i < fullMessage.length) {
          msgEl.innerHTML += fullMessage.charAt(i);
          i++;
        } else {
          clearInterval(timer);
          setTimeout(() => {
            document.getElementById('secretBtnWrapper').classList.add('show');
          }, 500);
        }
      }, 40);
    }

    function toggleSecretModal() {
      document.getElementById('secretModal').classList.toggle('active');
    }

    function toggleHeartPhotoModal() {
      startBackgroundAudio();
      document.getElementById('heartPhotoModal').classList.toggle('active');
    }
  </script>

</body>
