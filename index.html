<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Per te 💜</title>

  
  <link href="https://fonts.googleapis.com/css2?family=Satisfy&display=swap" rel="stylesheet">

  <style>
    
    @font-face {
      font-family: 'Harlow Solid Italic';
      src: url('HARLOWSI.TTF') format('truetype');
      font-weight: normal;
      font-style: normal;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Harlow Solid Italic', 'Satisfy', cursive, sans-serif;
      font-weight: normal;
      background: linear-gradient(rgba(0, 0, 0, 0.2), rgba(0, 0, 0, 0.35)), url('1.jpg');
      background-size: cover;
      background-position: center bottom; 
      background-repeat: no-repeat;
      background-attachment: fixed;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      background: rgba(11, 20, 30, 0.78); 
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      max-width: 420px;
      width: 100%;
      border-radius: 24px;
      padding: 28px;
      text-align: center;
      border: 2.5px solid rgba(52, 211, 153, 0.5);
      box-shadow: 
        0 0 15px rgba(52, 211, 153, 0.45), 
        0 0 40px rgba(52, 211, 153, 0.35), 
        0 0 80px rgba(52, 211, 153, 0.20),  
        0 20px 45px rgba(0, 0, 0, 0.7);     
    }

    .title {
      font-family: 'Harlow Solid Italic', 'Satisfy', cursive, sans-serif;
      font-size: 3rem;
      font-weight: normal;
      margin-bottom: 16px;
      color: #ffffff;
      text-shadow: 
        0 0 10px rgba(52, 211, 153, 0.7),
        0 0 20px rgba(52, 211, 153, 0.3);
    }

    .media-wrapper {
      position: relative;
      width: 100%;
      border-radius: 16px;
      overflow: hidden;
      margin-bottom: 18px;
      background-color: #0d1621;
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
    }

    .reveal-img {
      width: 100%;
      height: auto;
      display: block;
      -webkit-filter: blur(40px) scale(1.08);
      filter: blur(40px) scale(1.08);
      transition: -webkit-filter 0.8s ease, filter 0.8s ease, transform 0.8s ease;
    }

    .reveal-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(10, 18, 26, 0.45);
      display: flex;
      justify-content: center;
      align-items: center;
      color: #ffffff;
      font-weight: normal;
      font-size: 2rem;
      letter-spacing: 0.5px;
      transition: opacity 0.6s ease;
      backdrop-filter: blur(2px);
      z-index: 2;
    }

    .media-wrapper.revealed .reveal-img {
      -webkit-filter: blur(0) scale(1);
      filter: blur(0) scale(1);
    }

    .media-wrapper.revealed .reveal-overlay {
      opacity: 0;
      pointer-events: none;
    }

    .heart-particle {
      position: absolute;
      pointer-events: none;
      font-size: 1.5rem;
      user-select: none;
      z-index: 10;
      animation: floatAndFade 1.2s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    }

    @keyframes floatAndFade {
      0% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(0.3) rotate(0deg);
      }
      50% {
        opacity: 1;
        transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.3) rotate(var(--rot));
      }
      100% {
        opacity: 0;
        transform: translate(calc(-50% + var(--dx) * 1.4), calc(-50% + var(--dy) - 70px)) scale(0.8) rotate(calc(var(--rot) * 2));
      }
    }

    .message {
      font-size: 1.5rem;
      font-weight: normal;
      line-height: 1.6;
      color: #e2e8f0;
      min-height: 2.4em;
    }

  
    .secret-btn-wrapper {
      position: fixed;
      bottom: 20px;
      right: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 99;
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transform: translateY(15px);
      transition: opacity 0.8s ease, transform 0.8s ease;
    }

    .secret-btn-wrapper.show {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    .secret-btn {
      background: rgba(11, 20, 30, 0.85);
      border: 1.5px solid rgba(52, 211, 153, 0.6);
      color: #ffffff;
      font-size: 1.4rem;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 0 15px rgba(52, 211, 153, 0.4);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .secret-btn-wrapper:hover .secret-btn,
    .secret-btn-wrapper:active .secret-btn {
      transform: scale(1.08);
      box-shadow: 0 0 25px rgba(52, 211, 153, 0.7);
    }

    .click-me-label {
      font-family: sans-serif;
      font-size: 0.75rem;
      color: #34d399;
      margin-top: 4px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      font-weight: 600;
      text-shadow: 0 0 8px rgba(52, 211, 153, 0.5);
    }

 
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      justify-content: center;
      align-items: center;
      z-index: 200;
      padding: 20px;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .modal-overlay.active {
      display: flex;
      opacity: 1;
    }

    .modal-content {
      background: rgba(11, 20, 30, 0.92);
      border: 2px solid rgba(52, 211, 153, 0.6);
      border-radius: 20px;
      padding: 26px;
      max-width: 340px;
      width: 100%;
      text-align: center;
      position: relative;
      box-shadow: 0 0 30px rgba(52, 211, 153, 0.4);
      transform: scale(0.8);
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .modal-overlay.active .modal-content {
      transform: scale(1);
    }

    .modal-close {
      position: absolute;
      top: 10px;
      right: 14px;
      font-size: 1.5rem;
      color: #94a3b8;
      cursor: pointer;
      line-height: 1;
    }

    .modal-title {
      font-size: 1.8rem;
      color: #ffffff;
      margin-bottom: 12px;
    }

    .joke-text {
      font-family: sans-serif;
      font-size: 1.05rem;
      color: #e2e8f0;
      line-height: 1.5;
      margin-bottom: 16px;
    }

    .joke-punchline {
      font-family: sans-serif;
      font-weight: bold;
      color: #34d399;
      font-size: 1.1rem;
    }
  </style>
</head>
<body>

  <!-- Audio Element -->
  <audio id="cardAudio" src="Opeth_-_Ending_Credits_Damnation_2003_(mp3.pm).mp3" preload="auto"></audio>

  <div class="card">
    <h1 class="title">Per te 💜</h1>
    
    <div class="media-wrapper" id="revealBox" onclick="toggleReveal(event)">
      <img src="d3.jpg" alt="Special Creation" class="reveal-img" />
      
      <div class="reveal-overlay">
        <span>Tocca per rivelare✨</span>
      </div>
    </div>

    <p class="message"></p>
  </div>

  
  <div class="secret-btn-wrapper" id="secretBtnWrapper" onclick="toggleSecretModal()">
    <div class="secret-btn">💌</div>
    <span class="click-me-label">Click me</span>
  </div>

 
  <div id="secretModal" class="modal-overlay" onclick="toggleSecretModal()">
    <div class="modal-content" onclick="event.stopPropagation()">
      <span class="modal-close" onclick="toggleSecretModal()">&times;</span>
      <h2 class="modal-title">Nota Segreta 😜</h2>
      
      <p class="joke-text">
        Sei una query SQL? 
      </p>
      <p class="joke-punchline">
        Perché quando mi guardi, fai SELECT * FROM mio_cuore.🤪
      </p>
    </div>
  </div>

  <script>
    const fullMessage = "Spero che questo ti faccia sorridere e illumini la tua giornata, proprio come tu illumini la mia! 💜";
    let hasTyped = false;

    function typeWriterMessage() {
      if (hasTyped) return;
      hasTyped = true;
      
      const msgEl = document.querySelector('.message');
      msgEl.innerHTML = '';
      let i = 0;
      
      const timer = setInterval(() => {
        if (i < fullMessage.length) {
          msgEl.innerHTML += fullMessage.charAt(i);
          i++;
        } else {
          clearInterval(timer);
          
    
          setTimeout(() => {
            document.getElementById('secretBtnWrapper').classList.add('show');
          }, 500);
        }
      }, 40); 
    }

    function toggleReveal(event) {
      const box = document.getElementById('revealBox');
      const isOpening = !box.classList.contains('revealed');
      
      box.classList.toggle('revealed');

      if (isOpening) {
        spawnHearts(event, box);
        typeWriterMessage(); 

      
        const audio = document.getElementById('cardAudio');
        audio.currentTime = 70;
        audio.volume = 1.0;
        audio.play().catch(error => {
          console.log("Audio playback error:", error);
        });
      }
    }

    function toggleSecretModal() {
      const modal = document.getElementById('secretModal');
      modal.classList.toggle('active');
    }

    function spawnHearts(event, container) {
      const rect = container.getBoundingClientRect();
      
      const clickX = event ? (event.clientX - rect.left) : (rect.width / 2);
      const clickY = event ? (event.clientY - rect.top) : (rect.height / 2);

      const heartIcons = ['❤️', '💜', '✨', '💕', '💗'];
      const particleCount = 14;

      for (let i = 0; i < particleCount; i++) {
        const heart = document.createElement('span');
        heart.classList.add('heart-particle');
        
        heart.innerHTML = heartIcons[Math.floor(Math.random() * heartIcons.length)];

        const dx = (Math.random() - 0.5) * 160 + 'px';
        const dy = -(Math.random() * 100 + 30) + 'px';
        const rot = (Math.random() - 0.5) * 80 + 'deg';

        heart.style.setProperty('--dx', dx);
        heart.style.setProperty('--dy', dy);
        heart.style.setProperty('--rot', rot);

        heart.style.left = clickX + 'px';
        heart.style.top = clickY + 'px';

        container.appendChild(heart);

        setTimeout(() => {
          heart.remove();
        }, 1200);
      }
    }
  </script>

</body>
</html>
