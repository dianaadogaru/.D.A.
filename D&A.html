<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sorpresa per te</title>

  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Satisfy&display=swap" rel="stylesheet">

  <style>
    
    @font-face {
      font-family: 'Harlow Solid Italic';
      src: url('HARLOWSI.TTF') format('truetype');
      font-weight: normal;
      font-style: normal;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Harlow Solid Italic', 'Satisfy', cursive, sans-serif;
      font-weight: normal; 
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      background: #ffffff;
      max-width: 420px;
      width: 100%;
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
      text-align: center;
    }

    .title {
      font-family: 'Harlow Solid Italic', 'Satisfy', cursive, sans-serif;
      font-size: 3.5rem;
      font-weight: normal;
      margin-bottom: 16px;
      color: #1a202c;
    }

    .media-wrapper {
      position: relative;
      width: 100%;
      border-radius: 14px;
      overflow: hidden;
      margin-bottom: 16px;
      background-color: #edf2f7;
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    
    .reveal-img {
      width: 100%;
      height: auto;
      display: block;
      -webkit-filter: blur(40px) scale(1.08);
      filter: blur(40px) scale(1.08);
      transition: -webkit-filter 0.8s ease, filter 0.8s ease, transform 0.8s ease;
    }

    .reveal-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.35);
      display: flex;
      justify-content: center;
      align-items: center;
      color: #ffffff;
      font-weight: normal;
      font-size: 2.5rem;
      letter-spacing: 0.5px;
      transition: opacity 0.6s ease;
      backdrop-filter: blur(2px);
      z-index: 2;
    }

    .media-wrapper.revealed .reveal-img {
      -webkit-filter: blur(0) scale(1);
      filter: blur(0) scale(1);
    }

    .media-wrapper.revealed .reveal-overlay {
      opacity: 0;
      pointer-events: none;
    }

    .heart-particle {
      position: absolute;
      pointer-events: none;
      font-size: 2.5rem;
      user-select: none;
      z-index: 10;
      animation: floatAndFade 1.2s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    }

    @keyframes floatAndFade {
      0% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(0.3) rotate(0deg);
      }
      50% {
        opacity: 1;
        transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.3) rotate(var(--rot));
      }
      100% {
        opacity: 0;
        transform: translate(calc(-50% + var(--dx) * 1.4), calc(-50% + var(--dy) - 70px)) scale(0.8) rotate(calc(var(--rot) * 2));
      }
    }

    .message {
      font-size: 2rem;
      font-weight: normal;
      line-height: 1.6;
      color: #4a5568;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1 class="title">Sorpresa per te</h1>
    
    <div class="media-wrapper" id="revealBox" onclick="toggleReveal(event)">
      <img src="d.jpg" alt="Special Creation" class="reveal-img" />
      
      <div class="reveal-overlay">
        <span>Tocca per rivelare✨</span>
      </div>
    </div>

    <p class="message">
      Spero che questo ti faccia sorridere e illumini la tua giornata, proprio come tu illumini la mia! ❤️
    </p>
  </div>

  <script>
    function toggleReveal(event) {
      const box = document.getElementById('revealBox');
      const isOpening = !box.classList.contains('revealed');
      
      box.classList.toggle('revealed');

      if (isOpening) {
        spawnHearts(event, box);
      }
    }

    function spawnHearts(event, container) {
      const rect = container.getBoundingClientRect();
      
      const clickX = event ? (event.clientX - rect.left) : (rect.width / 2);
      const clickY = event ? (event.clientY - rect.top) : (rect.height / 2);

      const heartIcons = ['❤️', '💖', '✨', '💕', '💗'];
      const particleCount = 14;

      for (let i = 0; i < particleCount; i++) {
        const heart = document.createElement('span');
        heart.classList.add('heart-particle');
        
        heart.innerHTML = heartIcons[Math.floor(Math.random() * heartIcons.length)];

        const dx = (Math.random() - 0.5) * 160 + 'px';
        const dy = -(Math.random() * 100 + 30) + 'px';
        const rot = (Math.random() - 0.5) * 80 + 'deg';

        heart.style.setProperty('--dx', dx);
        heart.style.setProperty('--dy', dy);
        heart.style.setProperty('--rot', rot);

        heart.style.left = clickX + 'px';
        heart.style.top = clickY + 'px';

        container.appendChild(heart);

        setTimeout(() => {
          heart.remove();
        }, 1200);
      }
    }
  </script>

</body>
</html>
